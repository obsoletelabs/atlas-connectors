name: ci

# Path-filtered CI (CONTRACT-C15 section 12). tools/ci_changes.py decides what runs:
#   packages/<p>/   -> package <p> only
#   dotnet/ contract/ tools/ catalogues/ .github/ root files, or any unknown path -> every package
#   docs only -> nothing
#   main and tags -> everything
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      atlas_ref:
        description: Atlas ref for the live lane (default is the pinned one below)
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.sel.outputs.python }}
      contract: ${{ steps.sel.outputs.contract }}
      dotnet: ${{ steps.sel.outputs.dotnet }}
      live: ${{ steps.sel.outputs.live }}
      packages: ${{ steps.sel.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: sel
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF: ${{ github.ref_name == 'main' && 'main' || github.ref }}
        run: python tools/ci_changes.py

  python:
    needs: gate
    if: needs.gate.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Offline tests (change detection, contract pins, testkit logic)
        run: python -m pytest tests -q
      - name: Contract pins hold, Atlas's own pins agree, no scaffold stand-in came back
        if: needs.gate.outputs.contract == 'true'
        run: python tools/contract_pin.py release-check

  # The shared C# client and its tests (no network: a fake HTTP handler over contract/fixtures). Also proves the
  # "compiled in as source" promise: a net462 library takes the sources with Newtonsoft only, at C# 7.3.
  dotnet:
    needs: gate
    if: needs.gate.outputs.dotnet == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build the client sources (netstandard2.0, C# 7.3, warnings are errors)
        run: dotnet build dotnet/Atlas.Client -c Release
      - name: Build the net462 source-consumer check (Newtonsoft only)
        run: dotnet build dotnet/Atlas.Client.SourceCheck -c Release
      - name: Test the client against contract/fixtures
        run: dotnet test dotnet/Atlas.Client.Tests -c Release --logger "trx;LogFileName=atlas-client.trx" --results-directory test-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: atlas-client-test-results
          path: test-results/*.trx
          if-no-files-found: ignore

  # One job per package.
  # Windows only: the Playnite SDK, WPF and DPAPI are Windows/.NET Framework things; the tests run on .NET Framework 4.8.
  package-playnite:
    needs: gate
    if: contains(format(',{0},', needs.gate.outputs.packages), ',playnite,')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the extension (net462, C# 7.3, warnings are errors)
        run: dotnet build packages/playnite/Atlas.Playnite -c Release
      - name: Test (vectors, provider, settings, DPAPI) on .NET Framework 4.8
        run: dotnet test packages/playnite/Atlas.Playnite.Tests -c Release --logger "trx;LogFileName=atlas-playnite.trx" --results-directory test-results
      - name: Pack the .pext and check it
        shell: bash
        run: |
          python packages/playnite/pack.py --no-build
          for f in packages/playnite/dist/*.pext; do python packages/playnite/pack.py --verify "$f"; done
      - name: Packaging script tests
        run: |
          python -m pip install pytest
          python -m pytest tests/test_playnite_package.py -q
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: atlas-playnite
          path: |
            test-results/*.trx
            packages/playnite/dist/*
          if-no-files-found: ignore

  # Linux is enough: the plugin is plain net9.0 / net10.0 code against the Jellyfin NuGet packages. One build and one test run per
  # supported ABI (packages/jellyfin/abis.json). No Jellyfin server is started here (see the README "Not verified" section).
  package-jellyfin:
    needs: gate
    if: contains(format(',{0},', needs.gate.outputs.packages), ',jellyfin,')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and test for Jellyfin 10.11 (net9.0)
        run: dotnet test packages/jellyfin/Jellyfin.Plugin.Atlas.Tests -c Release -p:JellyfinAbi=10.11 --logger "trx;LogFileName=atlas-jellyfin-10.11.trx" --results-directory test-results
      - name: Build and test for Jellyfin 12 (net10.0)
        run: dotnet test packages/jellyfin/Jellyfin.Plugin.Atlas.Tests -c Release -p:JellyfinAbi=12 --logger "trx;LogFileName=atlas-jellyfin-12.trx" --results-directory test-results
      - name: Pack one zip per ABI and check them
        run: |
          python packages/jellyfin/pack.py --no-build --abi 10.11
          python packages/jellyfin/pack.py --no-build --abi 12
          for z in packages/jellyfin/dist/*.zip; do python packages/jellyfin/pack.py --verify "$z"; done
      - name: Packaging and catalogue tests
        run: |
          python -m pip install pytest
          python -m pytest tests/test_jellyfin_package.py -q
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: atlas-jellyfin
          path: |
            test-results/*.trx
            packages/jellyfin/dist/*
          if-no-files-found: ignore

  # The live lane: a REAL Atlas, seeded with synthetic data, and the replay of the resolve contract against it.
  # The Atlas repository is public, so its source is fetched with a plain checkout: no secret is needed. Fork pull
  # requests are skipped (they are untrusted and the lane builds and runs Atlas). Once Atlas publishes a container
  # image, replace the build with a pinned image digest (decision D15.19).
  live-atlas:
    needs: gate
    if: needs.gate.outputs.live == 'true' && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ATLAS_REPOSITORY: obsoletelabs/unnamed_tracking_metadata
      # Pinned to the Atlas commit the contract files in contract/ were generated from (A24, programme branch
      # programme/a24-client-api-v1, client-api 1.0: `client_api` in /site and `atlas seed --fixture connectors-v1`).
      # Bump it deliberately, together with contract/, and to a release tag once Atlas tags one (version-unification PR).
      ATLAS_REF: ${{ inputs.atlas_ref || 'a6bbc2a7777090bcd1abe83b1aff135f078be466' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.ATLAS_REPOSITORY }}
          ref: ${{ env.ATLAS_REF }}
          path: .validation/atlas
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Build Atlas, start it, seed it (atlas seed + resolve seeds), replay the resolve contract and client-api calls
        run: |
          python tools/atlas_testkit.py run --atlas-source .validation/atlas --tag atlas-testkit:ci             -- python -m pytest tests/live -q

  # The single required status. A job may be skipped only when the gate did not select it. A live lane that was selected
  # but could not run (no secret) does not fail this check, but it is never reported as a pass: the log, a warning
  # annotation and the job summary all say "passed WITHOUT the live Atlas lane".
  required:
    needs: [gate, python, dotnet, package-playnite, package-jellyfin, live-atlas]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every selected job passed (a live lane that could not run is reported, not passed)
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] in {"failure", "cancelled"}}
          print({k: v["result"] for k, v in needs.items()})
          selected = needs["gate"].get("outputs", {}).get("live") == "true"
          ran = needs["live-atlas"]["result"] == "success"
          if selected and not ran and not bad:
              note = "required passed WITHOUT the live Atlas lane (live-atlas: %s)" % needs["live-atlas"]["result"]
              print("::warning::" + note)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
                  out.write("### " + note + "\n\nNo end-to-end check against a real Atlas ran for this commit. "
                            "Do not treat this run as live-verified.\n")
          sys.exit(1 if bad else 0)
          PY

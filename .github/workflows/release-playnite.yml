name: release-playnite

# Fires on tags playnite-v<semver> and builds ONLY the Playnite package (CONTRACT-C15 sections 8.2 and 12).
on:
  push:
    tags: ["playnite-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate the tag
        shell: bash
        run: |
          python tools/ci_changes.py --tag "$GITHUB_REF_NAME" | tee target.txt
          grep -qx "package=playnite" target.txt
      - name: Offline tests and contract pins
        shell: bash
        run: |
          python -m pip install pytest
          python -m pytest tests -q
          python tools/contract_pin.py check
      - name: Pack the .pext, attach it with checksums, regenerate catalogues/ and open the add-on database PR
        shell: bash
        run: |
          echo "::error::The Playnite package does not exist yet (PR X1). Refusing to publish an empty release."
          exit 1
